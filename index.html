<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>一笔成山 · 水墨版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f0e7;color:#272723;font-family:system-ui,-apple-system,sans-serif}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
header{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none}
h1{font-size:19px;letter-spacing:3px;font-weight:500;margin:0}small{display:block;margin-top:5px;font-size:11px;color:#807e76}
.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;pointer-events:auto}
button{background:#f4f0e7e8;border:1px solid #aaa69c;color:#272723;border-radius:20px;padding:8px 13px;font-size:13px}
.panel{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 36px));background:#f4f0e7ee;border:1px solid #d3cdc0;border-radius:16px;padding:13px 17px;box-shadow:0 5px 20px #2222220c}
.panel label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:9px}
input[type=range]{width:100%;accent-color:#292a28;touch-action:auto}
.note{text-align:center;font-size:11px;color:#858077;margin-top:6px}
</style></head><body><canvas id="c"></canvas>
<header><div><h1>一笔成山</h1><small>墨落成峦 · 一线生山</small></div><div class="controls"><button id="undo">撤回</button><button id="clear">清空</button></div></header>
<div class="panel"><label for="opacity">山体墨色透明度 <output id="value">20%</output></label><input id="opacity" type="range" min="0" max="100" step="1" value="20"><div class="note">横向画出山脊，松开后墨水缓缓落下</div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),slider=document.getElementById('opacity'),value=document.getElementById('value');
let W=0,H=0,D=1,mountains=[],stroke=[],drawing=false;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*D);c.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
slider.addEventListener('input',()=>value.textContent=slider.value+'%');
function point(e){return{x:e.clientX,y:e.clientY}}
c.addEventListener('pointerdown',e=>{drawing=true;stroke=[point(e)];c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e),q=stroke[stroke.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>2)stroke.push(p)});
function finish(){if(!drawing)return;drawing=false;let p=stroke.slice();stroke=[];if(p.length<3)return;if(p[0].x>p[p.length-1].x)p.reverse();
// Each x position has a single ridge height; avoids self-intersecting mountain polygons.
const bins=new Map();for(const v of p){const x=Math.round(v.x/2)*2;bins.set(x,Math.min(v.y,bins.has(x)?bins.get(x):v.y))}
p=[...bins].sort((a,b)=>a[0]-b[0]).map(([x,y])=>({x,y}));
if(p.length<3||p[p.length-1].x-p[0].x<24)return;
mountains.push({p,opacity:Number(slider.value)/100,start:performance.now()})}
c.addEventListener('pointerup',finish);c.addEventListener('pointercancel',finish);
document.getElementById('undo').onclick=()=>mountains.pop();document.getElementById('clear').onclick=()=>{mountains=[];stroke=[];drawing=false};
function trace(p){g.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)g.lineTo(p[i].x,p[i].y)}
function drawMountain(m,t){const p=m.p;const progress=Math.min(1,Math.max(0,(t-m.start)/2200));const bottom=-H+(2*H+80)*(1-Math.pow(1-progress,2));g.save();g.beginPath();trace(p);g.lineTo(p[p.length-1].x,H+40);g.lineTo(p[0].x,H+40);g.closePath();g.clip();g.fillStyle='#252623';g.globalAlpha=m.opacity;g.fillRect(p[0].x,0,p[p.length-1].x-p[0].x,Math.max(0,bottom));g.restore();g.beginPath();trace(p);g.strokeStyle='#20211f';g.globalAlpha=1;g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.stroke()}
function frame(t){g.fillStyle='#f4f0e7';g.fillRect(0,0,W,H);for(const m of mountains)drawMountain(m,t);if(stroke.length>1){g.beginPath();trace(stroke);g.strokeStyle='#20211f';g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.stroke()}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
