<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>一笔成山 · 水墨版</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eeeae0;color:#242522;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;justify-content:center}main{width:min(100%,900px);min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
header{text-align:center;flex-shrink:0}h1{font-size:24px;letter-spacing:6px;font-weight:500;margin:0 0 6px}header p{font-size:12px;color:#89857b;letter-spacing:2px;margin:0}
.frame{position:relative;flex:1;min-height:220px;max-height:68dvh;border:1px solid #bbb6a9;background:#f7f4eb;overflow:hidden;box-shadow:0 2px 12px #2928200a}
canvas{width:100%;height:100%;display:block;touch-action:none}
.panel{flex-shrink:0;padding:16px 18px 14px;background:#f7f4eb;border:1px solid #d4cec0;border-radius:12px}
label{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:11px}output{font-variant-numeric:tabular-nums}
input[type=range]{display:block;width:100%;accent-color:#262724;touch-action:auto}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}
button{border:1px solid #aaa69c;background:#f7f4eb;border-radius:8px;color:#242522;padding:12px 4px;font-size:14px}
button:disabled{opacity:.35}button:active:not(:disabled){background:#e4e0d5}
.hint{text-align:center;font-size:12px;color:#89857b;margin:0;flex-shrink:0}
@media(min-width:700px){main{padding-top:34px;padding-bottom:30px}.frame{max-height:66dvh;min-height:380px}}
</style></head><body><main>
<header><h1>一笔成山</h1><p>以线为脊 · 墨落成峦</p></header>
<div class="frame" id="frame"><canvas id="c"></canvas></div>
<section class="panel"><label for="opacity"><span>山体墨色透明度</span><output id="value">20%</output></label><input id="opacity" type="range" min="0" max="100" step="1" value="20"><div class="actions"><button id="undo" disabled>撤回</button><button id="redo" disabled>重做</button><button id="clear" disabled>清空</button></div></section>
<p class="hint">山脊浓墨向下渐淡 · 交叉笔迹自然积墨</p>
</main><script>
const canvas=document.getElementById('c'),frameEl=document.getElementById('frame'),ctx=canvas.getContext('2d'),slider=document.getElementById('opacity'),value=document.getElementById('value');
const undoBtn=document.getElementById('undo'),redoBtn=document.getElementById('redo'),clearBtn=document.getElementById('clear');
let W=0,H=0,D=1,mountains=[],undone=[],stroke=[],drawing=false,pointerId=null;
function resize(){const r=frameEl.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}
new ResizeObserver(resize).observe(frameEl);resize();
slider.addEventListener('input',()=>value.textContent=slider.value+'%');
function updateButtons(){undoBtn.disabled=mountains.length===0;redoBtn.disabled=undone.length===0;clearBtn.disabled=mountains.length===0}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W,e.clientX-r.left)),y:Math.max(0,Math.min(H,e.clientY-r.top))}}
canvas.addEventListener('pointerdown',e=>{if(drawing)return;drawing=true;pointerId=e.pointerId;stroke=[point(e)];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pointerId)return;const p=point(e),q=stroke[stroke.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>1.5)stroke.push(p)});
// Split a continuous stroke into directional sweeps. Each sweep deposits one ink layer.
function sweeps(points){
 const result=[];if(points.length<2)return result;
 let start=0,dir=0,extreme=points[0].x;
 for(let i=1;i<points.length;i++){
  const x=points[i].x;
  if(!dir){if(Math.abs(x-points[start].x)>=7){dir=Math.sign(x-points[start].x);extreme=x}continue}
  if(dir*(x-extreme)>=0){extreme=x;continue}
  if(dir*(extreme-x)>=9){
   const part=points.slice(start,i);
   if(part.length>1&&Math.abs(part.at(-1).x-part[0].x)>5)result.push(part);
   start=Math.max(0,i-2);dir=-dir;extreme=x;
  }
 }
 const last=points.slice(start);
 if(last.length>1&&Math.abs(last.at(-1).x-last[0].x)>5)result.push(last);
 return result;
}
function finish(e){
 if(!drawing||e.pointerId!==pointerId)return;
 drawing=false;pointerId=null;
 const raw=stroke.slice();stroke=[];
 if(raw.length<2)return;
 const layers=sweeps(raw).map(part=>part.map(v=>({x:v.x/W,y:v.y/H})));
 if(!layers.length)return;
 mountains.push({p:raw.map(v=>({x:v.x/W,y:v.y/H})),layers,opacity:Number(slider.value)/100,start:performance.now()});
 undone=[];updateButtons();
}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId){drawing=false;pointerId=null;stroke=[]}});
undoBtn.onclick=()=>{if(mountains.length){undone.push(mountains.pop());updateButtons()}};
redoBtn.onclick=()=>{if(undone.length){mountains.push(undone.pop());updateButtons()}};
clearBtn.onclick=()=>{mountains=[];undone=[];stroke=[];drawing=false;updateButtons()};
function trace(p){ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y)}
// Build a seamless ink layer once per sweep, using one pixel buffer instead of
// overlapping translucent rectangles. Texture is deliberately drawn separately.
function buildLayer(layer){
 const off=document.createElement('canvas');
 off.width=Math.ceil(W);off.height=Math.ceil(H);
 const og=off.getContext('2d');
 const pixels=og.createImageData(off.width,off.height);
 const ridge=new Float32Array(off.width);ridge.fill(Infinity);
 const pts=layer.map(v=>({x:v.x*W,y:v.y*H}));
 for(let i=1;i<pts.length;i++){
  const a=pts[i-1],b=pts[i],dx=b.x-a.x;
  if(Math.abs(dx)<0.01)continue;
  const lo=Math.max(0,Math.floor(Math.min(a.x,b.x)));
  const hi=Math.min(off.width-1,Math.ceil(Math.max(a.x,b.x)));
  for(let x=lo;x<=hi;x++){
   const t=Math.max(0,Math.min(1,(x+0.5-a.x)/dx));
   const y=a.y+(b.y-a.y)*t;
   ridge[x]=Math.min(ridge[x],y);
  }
 }
 const fade=Math.max(95,H*.58);
 for(let x=0;x<off.width;x++){
  const top=ridge[x];if(!Number.isFinite(top))continue;
  for(let y=Math.max(0,Math.floor(top));y<Math.min(off.height,Math.ceil(top+fade));y++){
   const dist=Math.max(0,(y+.5-top)/fade);
   const alpha=Math.round(255*Math.pow(1-dist,1.45));
   const k=(y*off.width+x)*4;
   pixels.data[k]=37;pixels.data[k+1]=38;pixels.data[k+2]=35;pixels.data[k+3]=alpha;
  }
 }
 og.putImageData(pixels,0,0);
 return {off,ridge,fade};
}
function drawMountain(m,t){
 if(!m.cache||m.cacheW!==Math.ceil(W)||m.cacheH!==Math.ceil(H)){
  m.cache=m.layers.map(buildLayer);m.cacheW=Math.ceil(W);m.cacheH=Math.ceil(H);
 }
 const progress=Math.min(1,Math.max(0,(t-m.start)/2400));
 const flow=H*(1-Math.pow(1-progress,2.2));
 for(let li=0;li<m.cache.length;li++){
  const item=m.cache[li];
  // Apply opacity once per layer; overlap only accumulates between actual sweeps.
  ctx.save();ctx.globalAlpha=m.opacity;
  const visible=H*(1-Math.pow(1-progress,2.2));
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,visible);ctx.clip();ctx.drawImage(item.off,0,0);ctx.restore();
  ctx.restore();
  // Explicit fine ink grain, stable across devices and not dependent on seams.
  ctx.save();ctx.strokeStyle='#252623';ctx.lineWidth=.65;
  ctx.globalAlpha=Math.min(.14,m.opacity*.22);
  const step=5.5;
  for(let x=3+((li*2.3)%step);x<W;x+=step){
   const xi=Math.floor(x),top=item.ridge[xi];
   if(!Number.isFinite(top))continue;
   const variation=.55+.45*Math.sin(x*.31+li*2.7);
   const len=Math.min(item.fade*(.4+.5*variation),H-top,flow-top);
   if(len<=0)continue;
   ctx.beginPath();ctx.moveTo(x,top+2);ctx.lineTo(x,top+len);ctx.stroke();
  }
  ctx.restore();
 }
}
function inkLine(p){
 if(p.length<2)return;
 ctx.save();ctx.beginPath();trace(p);ctx.globalAlpha=1;
 ctx.strokeStyle='#20211f';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.restore();
}
function render(t){
 ctx.fillStyle='#f7f4eb';ctx.fillRect(0,0,W,H);
 for(const m of mountains)drawMountain(m,t);
 // Ink outlines must be rendered last and at full opacity.
 for(const m of mountains)inkLine(m.p.map(v=>({x:v.x*W,y:v.y*H})));
 if(stroke.length>1)inkLine(stroke);
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script></body></html>
