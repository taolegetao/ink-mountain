<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一笔成山 · 青绿卷</title>
<style>
:root {
  color-scheme: light;
  --stone: #42718f;
  --deep: #163846;
  --lake: #84aaa2;
  --pale: #bbc8a9;
  --paper: #f7f4eb;
  --cream: #eee6d3;
  --gold: #d1b172;
  --line: #c7ae7e;
  --ink: #24444a;
  --muted: #526b68;
  --serif: "Noto Serif SC", "Songti SC", SimSun, serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  color: var(--ink);
  font-family: "Microsoft YaHei", system-ui, sans-serif;
  background: radial-gradient(ellipse at 15% 0%, #376478, transparent 65%), var(--deep);
}
main { max-width: 1560px; margin: auto; padding: 24px clamp(22px, 4vw, 66px) 18px; }
.masthead {
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 20px 30px;
  overflow: hidden;
  border: 1px solid #d1b17280;
  background: linear-gradient(105deg, #1d4050, #396582);
  color: var(--paper);
}
.mountains { position: absolute; right: 0; bottom: 0; width: min(68%, 790px); height: 100%; z-index: -1; }
.kicker, .folio { margin: 0; color: #e8d5af; font-size: 12px; letter-spacing: .22em; }
h1 { font: 600 clamp(32px, 4vw, 49px)/1.12 var(--serif); letter-spacing: .17em; margin: 7px 0; }
.subtitle { color: #e3ece5; font: 15px var(--serif); letter-spacing: .14em; margin: 0; }
.folio { align-self: flex-start; padding: 7px 9px; border: 1px solid #d1b17280; white-space: nowrap; }
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) 268px; gap: 18px; margin-top: 16px; align-items: stretch; }
.scroll { min-width: 0; display: flex; flex-direction: column; padding: 0 12px 9px; border: 1px solid var(--line); background: var(--cream); }
.scroll-head, .scroll-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 2px; font-size: 12px; color: var(--muted); }
.scroll-head strong { font: 600 15px var(--serif); letter-spacing: .18em; color: var(--ink); }
.scroll-foot { padding-bottom: 0; }
.frame {
  position: relative;
  height: clamp(390px, calc(100dvh - 256px), 820px);
  background: var(--paper);
  overflow: hidden;
  outline: 1px solid #a78e60;
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.frame::after {
  content: "";
  position: absolute;
  inset: 7px;
  pointer-events: none;
  background: conic-gradient(from 90deg at 1px 1px, transparent 90deg, #a78e606b 0) 0 0 / 14px 14px no-repeat;
  border: 1px solid #a78e602c;
}
.panel { display: flex; flex-direction: column; min-width: 0; padding: 19px 16px; border: 1px solid var(--line); background: var(--paper); }
.panel-title { font: 600 23px var(--serif); letter-spacing: .2em; margin: 0 0 5px; }
.panel-intro { margin: 0 0 16px; font-size: 12px; color: var(--muted); }
fieldset { min-width: 0; margin: 0; padding: 13px 0; border: 0; border-top: 1px solid #d8c9a8; }
legend { padding: 0 9px 0 0; font: 600 15px var(--serif); letter-spacing: .1em; }
.brush-switch, .actions { display: grid; gap: 7px; }
.brush-switch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.actions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
button { color: var(--ink); background: #f3f1e8; border: 1px solid #a7b8ae; padding: 9px 3px; font: 600 14px var(--serif); cursor: pointer; }
button:hover:not(:disabled) { background: #e2ebe1; border-color: var(--stone); }
button.active, button.active:hover { color: white; background: #315c6c; border-color: #315c6c; box-shadow: inset 0 -2px var(--lake); }
button:disabled { opacity: .46; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--stone); outline-offset: 3px; }
label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
output { color: #315c6c; font-variant-numeric: tabular-nums; }
.gradient-bar { height: 21px; margin: 8px 0; border: 1px solid #bfb5a3; }
.editor-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
input[type=range] { width: 100%; min-width: 0; margin: 0; accent-color: #315c6c; }
.panel-note { margin: auto 0 0; padding-top: 12px; color: var(--muted); line-height: 1.65; font-size: 12px; border-top: 1px solid #d8c9a8; }
.hint { margin: 12px 0 0; text-align: center; color: #e2eadd; font: 13px var(--serif); letter-spacing: .17em; }
@media (max-width: 790px) {
  main { padding: 14px; }
  .masthead { padding: 16px; }
  .workspace { grid-template-columns: 1fr; }
  .frame { height: max(285px, 48dvh); }
}
</style>
</head>
<body><main>
<header class="masthead">
  <svg class="mountains" aria-hidden="true" viewBox="0 0 800 140" preserveAspectRatio="none">
    <path fill="#bbc8a9" opacity=".44" d="M160 140 282 85 327 99 418 44 451 49 508 16 583 72 640 53 710 16 800 61V140Z"/>
    <path fill="#84aaa2" d="M255 140 337 105 392 111 447 75 494 85 574 53 631 100 715 62 763 83 800 70V140Z"/>
    <path fill="#42718f" d="M350 140 438 119 509 122 566 92 617 117 672 91 731 111 800 88V140Z"/>
    <path fill="none" stroke="#d1b172" opacity=".58" d="M255 140 337 105 392 111 447 75 494 85 574 53 631 100 715 62 763 83 800 70"/>
  </svg>
  <div><p class="kicker">山水画坊</p><h1>一笔成山</h1><p class="subtitle">以线为脊 · 墨落成峦</p></div>
  <p class="folio">青绿卷</p>
</header>
<div class="workspace">
  <section class="scroll" aria-label="画卷">
    <div class="scroll-head"><strong>宣纸画卷</strong><span>按住鼠标，拖动画出山脊</span></div>
    <div class="frame" id="frame"><canvas id="c" aria-label="山水画布"></canvas></div>
    <div class="scroll-foot"><span>月白笺</span><span>松开落墨 · 再落一笔可叠山</span></div>
  </section>
  <aside class="panel" aria-label="画具">
    <h2 class="panel-title">笔墨</h2>
    <p class="panel-intro">选笔式，调墨色。</p>
    <fieldset>
      <legend>笔式</legend>
      <div class="brush-switch"><button id="lineBrush" class="active" aria-pressed="true">线成山</button><button id="peakBrush" aria-pressed="false">峰成山</button></div>
    </fieldset>
    <fieldset>
      <legend>调墨</legend>
      <label for="stopAlpha"><span>墨色浓度</span><output id="alphaValue" for="stopAlpha">50%</output></label>
      <div id="gradientBar" class="gradient-bar" aria-hidden="true"></div>
      <div class="editor-row"><span>淡</span><input id="stopAlpha" type="range" min="0" max="100" step="1" value="50"><span>浓</span></div>
    </fieldset>
    <fieldset>
      <legend>画卷操作</legend>
      <div class="actions"><button id="undo" disabled>撤回</button><button id="redo" disabled>重做</button><button id="clear" disabled>清空</button></div>
    </fieldset>
    <p class="panel-note">线笔保留竖向墨纹，峰笔在起落处收淡。落笔后，墨色会沿山脊向下流淌。</p>
  </aside>
</div>
<p class="hint">随笔成山 · 起笔收笔皆有墨韵</p>
</main>
<script>
const canvas=document.getElementById('c'),frameEl=document.getElementById('frame'),ctx=canvas.getContext('2d');
const gradientBar=document.getElementById('gradientBar'),alphaSlider=document.getElementById('stopAlpha');
function inkStrength(){return +alphaSlider.value/100}
function flowLength(strength,height){return height*(.15+.65*strength)}
function updateEditor(){
 const ink=inkStrength();
 document.getElementById('alphaValue').textContent=Math.round(ink*100)+'%';
 gradientBar.style.background='linear-gradient(to right,rgba(37,38,35,'+ink+'),rgba(37,38,35,0))';
}
alphaSlider.addEventListener('input',updateEditor);updateEditor();
let brushMode='line';const lineBrush=document.getElementById('lineBrush'),peakBrush=document.getElementById('peakBrush');function setBrush(mode){brushMode=mode;lineBrush.classList.toggle('active',mode==='line');peakBrush.classList.toggle('active',mode==='peak');lineBrush.setAttribute('aria-pressed',mode==='line');peakBrush.setAttribute('aria-pressed',mode==='peak')}lineBrush.onclick=()=>setBrush('line');peakBrush.onclick=()=>setBrush('peak');
const undoBtn=document.getElementById('undo'),redoBtn=document.getElementById('redo'),clearBtn=document.getElementById('clear');
let W=0,H=0,D=1,mountains=[],undone=[],stroke=[],drawing=false,pointerId=null;
function resize(){const r=frameEl.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);D=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}
new ResizeObserver(resize).observe(frameEl);resize();

function updateButtons(){undoBtn.disabled=mountains.length===0;redoBtn.disabled=undone.length===0;clearBtn.disabled=mountains.length===0}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W,e.clientX-r.left)),y:Math.max(0,Math.min(H,e.clientY-r.top))}}
canvas.addEventListener('pointerdown',e=>{if(drawing)return;drawing=true;pointerId=e.pointerId;stroke=[point(e)];canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pointerId)return;const p=point(e),q=stroke[stroke.length-1];if(Math.hypot(p.x-q.x,p.y-q.y)>1.5)stroke.push(p)});
// Split a continuous stroke into directional sweeps. Each sweep deposits one ink layer.
function sweeps(points){
 const result=[];if(points.length<2)return result;
 let start=0,dir=0,extreme=points[0].x;
 for(let i=1;i<points.length;i++){
  const x=points[i].x;
  if(!dir){if(Math.abs(x-points[start].x)>=7){dir=Math.sign(x-points[start].x);extreme=x}continue}
  if(dir*(x-extreme)>=0){extreme=x;continue}
  if(dir*(extreme-x)>=9){
   const part=points.slice(start,i);
   if(part.length>1&&Math.abs(part.at(-1).x-part[0].x)>5)result.push(part);
   start=Math.max(0,i-2);dir=-dir;extreme=x;
  }
 }
 const last=points.slice(start);
 if(last.length>1&&Math.abs(last.at(-1).x-last[0].x)>5)result.push(last);
 return result;
}
// Peak brush keeps the actual gesture. Its first/last segments are ink-light,
// and the flowing body tapers with the same distance-based strength.
function peakEnvelope(points){
 const d=[0];for(let i=1;i<points.length;i++)d.push(d[i-1]+Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y));
 const total=d.at(-1)||1,soft=Math.min(100,Math.max(22,total*.23));
 return d.map(v=>{const a=Math.min(1,v/soft,(total-v)/soft);const t=Math.max(0,a);return t*t*(3-2*t)});
}
function finish(e){
 if(!drawing||e.pointerId!==pointerId)return;
 drawing=false;pointerId=null;
 const raw=stroke.slice();stroke=[];
 if(raw.length<2)return;
 const peak=brushMode==='peak';
 const source=raw;
 const parts=sweeps(raw);
 const layers=parts.map(part=>part.map(v=>({x:v.x/W,y:v.y/H})));
 const ridgeWeights=peakEnvelope(raw);
 const indexByPoint=new Map(raw.map((p,i)=>[p,i]));
 const layerWeights=peak?parts.map(part=>part.map(p=>ridgeWeights[indexByPoint.get(p)]??1)):null;
 if(!layers.length)return;
 mountains.push({p:source.map(v=>({x:v.x/W,y:v.y/H})),layers,layerWeights,ridgeWeights,peak,ink:inkStrength(),seed:mountains.length*1.83+raw[0].x*.037+raw[0].y*.021,start:performance.now()});
 undone=[];updateButtons();
}
canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',e=>{if(e.pointerId===pointerId){drawing=false;pointerId=null;stroke=[]}});
undoBtn.onclick=()=>{if(mountains.length){undone.push(mountains.pop());updateButtons()}};
redoBtn.onclick=()=>{if(undone.length){mountains.push(undone.pop());updateButtons()}};
clearBtn.onclick=()=>{mountains=[];undone=[];stroke=[];drawing=false;updateButtons()};
function trace(p){ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y)}
// Build a seamless ink layer once per sweep, using one pixel buffer instead of
// overlapping translucent rectangles. Texture is deliberately drawn separately.
function gradientAlpha(gradient,percent){
 if(percent<=gradient[0].pos)return gradient[0].alpha/100;
 for(let i=1;i<gradient.length;i++){const a=gradient[i-1],b=gradient[i];if(percent<=b.pos){const t=b.pos===a.pos?1:(percent-a.pos)/(b.pos-a.pos);return (a.alpha+(b.alpha-a.alpha)*t)/100}}
 return gradient[gradient.length-1].alpha/100;
}
function buildLayer(layer,ink,peak=false,weights=null){
 const off=document.createElement('canvas');
 off.width=Math.ceil(W);off.height=Math.ceil(H);
 const og=off.getContext('2d');
 const pixels=og.createImageData(off.width,off.height);
 const ridge=new Float32Array(off.width);ridge.fill(Infinity);
 const strength=new Float32Array(off.width);
 const pts=layer.map(v=>({x:v.x*W,y:v.y*H}));
 for(let i=1;i<pts.length;i++){
  const a=pts[i-1],b=pts[i],dx=b.x-a.x;
  if(Math.abs(dx)<0.01)continue;
  const lo=Math.max(0,Math.floor(Math.min(a.x,b.x)));
  const hi=Math.min(off.width-1,Math.ceil(Math.max(a.x,b.x)));
  for(let x=lo;x<=hi;x++){
   const t=Math.max(0,Math.min(1,(x+0.5-a.x)/dx));
   const y=a.y+(b.y-a.y)*t;
   if(y<ridge[x]){ridge[x]=y;strength[x]=weights?weights[i-1]+(weights[i]-weights[i-1])*t:1;}
  }
 }
 const fade=flowLength(ink,H);
 const xStart=Math.min(...pts.map(p=>p.x)),xEnd=Math.max(...pts.map(p=>p.x));
 const feather=Math.min(65,Math.max(18,(xEnd-xStart)*.23));
 for(let x=0;x<off.width;x++){
  const top=ridge[x];if(!Number.isFinite(top))continue;
  for(let y=Math.max(0,Math.floor(top));y<Math.min(off.height,Math.ceil(top+fade));y++){
   const dist=Math.max(0,(y+.5-top)/fade);
   const taper=peak?strength[x]:1;
   const alpha=Math.round(255*ink*taper*Math.pow(Math.max(0,1-dist),1.35));
   const k=(y*off.width+x)*4;
   pixels.data[k]=37;pixels.data[k+1]=38;pixels.data[k+2]=35;pixels.data[k+3]=alpha;
  }
 }
 og.putImageData(pixels,0,0);
 return {off,ridge,fade,xStart,xEnd,feather,strength};
}
// Stable, gently uneven ink front. Each column begins at its own ridge height.
function frontAt(item,x,progress,seed){
 const top=item.ridge[Math.max(0,Math.min(item.ridge.length-1,Math.floor(x)))];
 if(!Number.isFinite(top))return NaN;
 const wave=Math.sin(x*.027+seed)*.16+Math.sin(x*.083+seed*1.7)*.075;
 const delay=Math.max(0,Math.min(.38,.18+wave));
 const local=Math.max(0,Math.min(1,(progress-delay)/(1-delay)));
 const eased=local*local*(3-2*local);
 const flutter=Math.sin(x*.038+seed)*9+Math.sin(x*.097+seed*2)*4;
 const taper=item.strength[Math.max(0,Math.min(item.strength.length-1,Math.floor(x)))];
 return Math.min(H,top+Math.max(0,(item.fade*eased+flutter*Math.sin(Math.PI*local))*taper));
}
function clipInkFront(item,progress,seed){
 ctx.beginPath();
 let active=false,begin=0,prev=0;
 for(let x=0;x<item.ridge.length;x++){
  if(Number.isFinite(item.ridge[x])){
   if(!active){active=true;begin=x;ctx.moveTo(x,item.ridge[x]);}
   else ctx.lineTo(x,item.ridge[x]);
   prev=x;
  }else if(active){
   for(let j=prev;j>=begin;j--)ctx.lineTo(j,frontAt(item,j,progress,seed));
   ctx.closePath();active=false;
  }
 }
 if(active){for(let j=prev;j>=begin;j--)ctx.lineTo(j,frontAt(item,j,progress,seed));ctx.closePath()}
 ctx.clip();
}
function drawMountain(m,t){
 if(!m.cache||m.cacheW!==Math.ceil(W)||m.cacheH!==Math.ceil(H)){
  m.cache=m.layers.map((layer,i)=>buildLayer(layer,m.ink,m.peak,m.layerWeights?.[i]));m.cacheW=Math.ceil(W);m.cacheH=Math.ceil(H);
 }
 const progress=Math.min(1,Math.max(0,(t-m.start-180)/3000));
 for(let li=0;li<m.cache.length;li++){
  const item=m.cache[li],seed=(m.seed||1)+li*2.31;
  ctx.save();
  clipInkFront(item,progress,seed);
  ctx.drawImage(item.off,0,0);
  // A narrow, soft wet-ink fringe below the ridge; never blur the sharp upper outline.
  if(progress>0){
   ctx.save();ctx.beginPath();
   let inRun=false;
   for(let x=0;x<item.ridge.length;x+=2){
    const y=item.ridge[x];
    if(Number.isFinite(y)){if(!inRun){ctx.moveTo(x,y+3);inRun=true}else ctx.lineTo(x,y+3)}
    else inRun=false;
   }
   ctx.strokeStyle='rgba(37,38,35,'+(.055*m.ink)+')';ctx.lineWidth=4;
   ctx.shadowColor='rgba(37,38,35,'+(.1*m.ink)+')';ctx.shadowBlur=4;
   ctx.stroke();ctx.restore();
  }
  // Keep the existing independent fine vertical ink grain.
  ctx.strokeStyle='#252623';ctx.lineWidth=.65;
  ctx.globalAlpha=Math.min(.065,m.ink*.085)*Math.min(1,progress*1.5)*(m.peak?.45:1);
  const step=m.peak?20:12.5;
  for(let x=3+((li*2.3)%step);x<W;x+=step){
   const top=item.ridge[Math.floor(x)];if(!Number.isFinite(top))continue;
   const variation=.55+.45*Math.sin(x*.31+li*2.7);
   const len=Math.min(item.fade*(.25+.45*variation)*item.strength[Math.floor(x)],H-top);
   if(len<=0)continue;
   if(item.strength[Math.floor(x)]<.45)continue;
   ctx.beginPath();ctx.moveTo(x,top+2);ctx.lineTo(x,top+len);ctx.stroke();
  }
  ctx.restore();
 }
}
function inkLine(p){
 if(p.length<2)return;
 ctx.save();ctx.beginPath();trace(p);ctx.globalAlpha=1;
 ctx.strokeStyle='#20211f';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.restore();
}
// Wet ridge: retain a fine upper contour while the lower edge breaks into soft ink.
function wetRidge(m,t){
 const p=m.p.map(v=>({x:v.x*W,y:v.y*H}));
 if(p.length<2)return;
 const age=Math.max(0,Math.min(1,(t-m.start-120)/2900));
 // Diffuse body is drawn beneath the crisp upper edge, with stable uneven depth.
 ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 for(let i=1;i<p.length;i++){
  const a=p[i-1],b=p[i],dx=b.x-a.x,dy=b.y-a.y;
  const length=Math.hypot(dx,dy);if(length<.1)continue;
  const steps=Math.max(1,Math.ceil(length/3));
  for(let k=0;k<steps;k++){
   const q=(k+.5)/steps,x=a.x+dx*q,y=a.y+dy*q;
   const n=Math.sin(x*.052+m.seed*2.7)*.5+Math.sin(x*.117+m.seed)*.3+Math.sin(x*.023+m.seed*3.1)*.2;
   const localAge=Math.max(0,Math.min(1,(age-Math.max(0,n)*.16)/(.95-Math.max(0,n)*.16)));
   const edge=m.ridgeWeights?.[Math.min(p.length-1,i-1)]??1;
   const depth=localAge*(1+Math.max(0,n)*10)*Math.min(1,m.ink*1.4)*edge;
   if(depth<=0)continue;
   ctx.strokeStyle='rgba(36,37,34,'+(m.ink*edge*(.07+.07*Math.max(0,n)))+')';
   ctx.lineWidth=1.8+localAge*2.4;
   ctx.beginPath();ctx.moveTo(x,y+.5);ctx.lineTo(x,y+depth);ctx.stroke();
  }
 }
 // Soft bloom also follows the full-stroke entry and exit taper.
 for(let i=1;i<p.length;i++){
  const edge=((m.ridgeWeights?.[i-1]??1)+(m.ridgeWeights?.[i]??1))*.5;
  if(edge<=0)continue;
  ctx.beginPath();ctx.moveTo(p[i-1].x,p[i-1].y);ctx.lineTo(p[i].x,p[i].y);
  ctx.lineWidth=1.8+age*2.2*Math.min(1,m.ink*1.4);
  ctx.strokeStyle='rgba(35,36,33,'+(.07*m.ink*age*edge)+')';
  ctx.shadowColor='rgba(35,36,33,'+(.12*m.ink*edge)+')';
  ctx.shadowBlur=age*3;ctx.stroke();
 }
 ctx.restore();
 // Upper edge is thinner than V10, and no longer visually seals the ink underneath.
 const baseInk=m.ink;
 const finalRidge=Math.min(1,baseInk+.05);
 const settle=age*age*(3-2*age);
 ctx.save();ctx.strokeStyle='#242521';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=1.45;
 for(let i=1;i<p.length;i++){
  const edge=((m.ridgeWeights?.[i-1]??1)+(m.ridgeWeights?.[i]??1))*.5;
  if(edge<=0)continue;
  ctx.globalAlpha=(1-(1-finalRidge)*settle)*edge;
  ctx.beginPath();ctx.moveTo(p[i-1].x,p[i-1].y);ctx.lineTo(p[i].x,p[i].y);ctx.stroke();
 }
 ctx.restore();
}
function render(t){
 ctx.fillStyle='#f7f4eb';ctx.fillRect(0,0,W,H);
 for(const m of mountains)drawMountain(m,t);
 // Wet ridges are rendered last; their opacity settles toward the chosen ink strength.
 for(const m of mountains)wetRidge(m,t);
 if(stroke.length>1)inkLine(stroke);
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script></body></html>
