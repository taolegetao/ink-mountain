<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>一笔成山</title><style>body{margin:0;background:#f3f0e8;font-family:system-ui;color:#4c6668}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:fixed;top:15px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}button{pointer-events:auto;border:1px solid #9aaba8;background:#f5f4ed;border-radius:20px;padding:9px;color:#4c6668}footer{position:fixed;bottom:25px;text-align:center;width:100%;font-size:12px;pointer-events:none}</style><canvas id="c"></canvas><header><span>一笔成山 · 墨落成峦</span><span><button id="undo">撤回</button> <button id="clear">清空</button></span></header><footer>画一道起伏的山脊，松开手指</footer><script>const c=document.querySelector('#c'),g=c.getContext('2d');let W,H,items=[],line=[],down=false;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=resize;resize();c.onpointerdown=e=>{down=true;line=[[e.clientX,e.clientY]];c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(down)line.push([e.clientX,e.clientY])};c.onpointerup=()=>{down=false;if(line.length>3){let p=line;if(p[0][0]>p.at(-1)[0])p=p.reverse();p=p.filter((v,i)=>i===0||v[0]>p[i-1][0]);if(p.length>3)items.push({p,t:performance.now()})}line=[]};document.querySelector('#undo').onclick=()=>items.pop();document.querySelector('#clear').onclick=()=>items=[];function trace(p){g.moveTo(...p[0]);for(let i=1;i<p.length;i++)g.lineTo(...p[i])}function frame(t){g.fillStyle='#f3f0e8';g.fillRect(0,0,W,H);items.forEach((m,i)=>{let p=m.p,y=Math.min(H+30,Math.max(...p.map(v=>v[1]))+(H+30)*(Math.min(1,(t-m.t)/2400)));g.save();g.beginPath();trace(p);g.lineTo(p.at(-1)[0],H+30);g.lineTo(p[0][0],H+30);g.closePath();g.clip();let grad=g.createLinearGradient(0,0,0,H);grad.addColorStop(0,['#526e75','#748d90','#607d81'][i%3]);grad.addColorStop(1,'#c3d0c9');g.globalAlpha=.8;g.fillStyle=grad;g.fillRect(0,0,W,y);g.restore();g.beginPath();trace(p);g.strokeStyle='#4c686c';g.lineWidth=1.5;g.stroke()});if(line.length){g.beginPath();trace(line);g.strokeStyle='#4c686c';g.lineWidth=2;g.stroke()}requestAnimationFrame(frame)}requestAnimationFrame(frame)</script></html>
